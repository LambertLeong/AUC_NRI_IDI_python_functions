[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "more-metrics"
version = "1.0.0"
description = "Statistically sound AUC, NRI, and IDI metrics for binary classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Lambert T Leong", email = "lamberttleong@gmail.com" },
]
keywords = [
  "auc",
  "classification",
  "idi",
  "machine-learning",
  "nri",
  "risk-prediction",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.23",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "jupyter>=1.0",
  "mypy>=1.11",
  "nbconvert>=7.16",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "twine>=6.0",
]

[project.urls]
Changelog = "https://github.com/LambertLeong/AUC_NRI_IDI_python_functions/blob/main/CHANGELOG.md"
Documentation = "https://github.com/LambertLeong/AUC_NRI_IDI_python_functions#readme"
Issues = "https://github.com/LambertLeong/AUC_NRI_IDI_python_functions/issues"
Repository = "https://github.com/LambertLeong/AUC_NRI_IDI_python_functions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
  "examples/*.ipynb",
]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
packages = ["more_metrics"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=src/more_metrics",
  "--cov-branch",
  "--cov-report=term-missing",
]
testpaths = [
  "tests",
]

[tool.coverage.run]
branch = true
source = ["src/more_metrics"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
